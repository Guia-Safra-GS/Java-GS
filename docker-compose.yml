version: "3.9"
 
networks:
  guiasafra-net:
    driver: bridge
 
services:
 
  # ─── Container da Aplicação ───────────────────────────────────────────────
  # Nome contém o RM do representante da equipe (requisito do edital)
  guiasafra-app-rm565592:
    build: .
    container_name: guiasafra-app-rm565592
    environment:
      - APP_PORT=8080
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
    ports:
      - "8080:8080"
    networks:
      - guiasafra-net
 
