spring.application.name=GuiaSafra

server.error.include-stacktrace=never
server.error.include-message=always

# variavel de ambiente para deploy...
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:seu_usuario_fiap}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sua_senha_fiap}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# API externa de clima (Open-Meteo).
climate.api.base-url=https://api.open-meteo.com/v1/forecast
climate.api.default-latitude=-23.55
climate.api.default-longitude=-46.63
